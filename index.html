{type:'grid',im:[["abaca plant Musa textilis", "Abaca plant"], ["abaca fiber stripping", "Stripping the fibers"], ["abaca fibers drying", "Drying"]],x:['abaca'],k:'T’nalak · Stage 1',t:'Step 1: Harvesting the Abaca',c:[['The plant','Abaca, locally called kedungon, belongs to the same family as banana plants.'],['The harvest','T’boli men harvest it. Before cutting, they offer a prayer to Fu Dalu, the spiritual guardian of T’nalak weaving.'],['The size','Plants must be 2–3 years old, with trunks about 14–18 inches in diameter.'],['Stripping','The trunk is stripped into layers. Fibers are separated from the pulp with a wooden block and a sharp knife.'],['Preparing','Fibers are combed right away to remove sap, sorted by thickness, and dried inside the house.',1]]},
{type:'grid',im:[["abaca fiber hand knotting weaver", "Knotting fibers"], ["abaca fibers bundle", "Bundled fibers"]],x:['suk'],k:'T’nalak · Stage 2',t:'Step 2: Tembong (Connecting)',c:[['Softening','After drying at least 24 hours, fibers are hand-rubbed to soften them and make them easier to separate by quality.'],['Warp & weft','Fine fibers are used for the warp (lengthwise threads), thicker fibers for the weft (crosswise threads).'],['Connecting','Fibers are joined end to end with tiny knots. Ends are trimmed with a suk t’bong (small weaver’s blade) so the joins are invisible.'],['Bundling','The connected fibers are bundled for weaving. This can take up to two weeks.',1]]},
{type:'grid',im:[["warp threads frame loom setting", "Setting the warp"], ["Tboli loom warp", "T’boli loom"]],x:['gono', 'teladay'],k:'T’nalak · Stage 3',t:'Step 3: Semdang (Setting)',c:[['The loom','The connected fibers, which form the warp, are placed on the traditional T’boli loom called gono smoi.'],['The frame','A comb-like wooden frame with upward-pointing teeth that help maintain the fibers’ length and silkiness.'],['Arranging','Fibers are smoothened, evenly arranged, and placed closely together on the frame.'],['The bar','A wooden bar called teladay is placed across the fibers to hold them in place before knotting.',1]]},
{type:'grid',im:[["ikat tying resist dye threads", "Tying (ikat)"], ["ikat warp threads bundles", "Ikat bundles"]],k:'T’nalak · Stage 4',t:'Step 4: Mebed (Designing)',c:[['No sketches','Weavers rely on mental images and traditional designs passed down through generations.'],['The knots','Fibers are grouped into four or five strands and tightly knotted with beeswax-coated black abaca threads.'],['Resist-dyeing (ikat)','Knots stop certain areas from absorbing dye. The first set preserves the natural white; the second protects areas meant to become red.'],['The time','About four to five weeks, as knot after knot is tied into place.',1]]},
{type:'grid',im:[["Knalum leaves natural dye", "K’nalum leaves"], ["natural dye boiling pot threads", "Boiling the dye"], ["dyed abaca fibers drying", "Dyed fibers"]],x:['knalum'],k:'T’nalak · Stage 5',t:'Step 5: Black Dye (Hitem)',c:[['The dye','Comes from the leaves of the K’nalum tree.'],['Preparing','The leaves are pounded and boiled in water for 2–4 hours.'],['Dyeing','The tied fibers are dyed for approximately 3 weeks.'],['After black','Fibers are rinsed in running water and air-dried for about 2 days. The knots reserved for red are removed with a suk t’bong (small knife).',1]]},
{type:'grid',im:[["Loko tree bark roots", "Loko bark and roots"], ["natural red dye roots thread", "Red dye"], ["dyed thread hanging drying", "Dyed thread"]],x:['loko'],k:'T’nalak · Stage 5',t:'Step 5: Red Dye (Hulo)',c:[['The dye','Extracted from the roots and bark of the Loko tree.'],['Preparing','Around 1 kilogram of bark and roots is boiled for 30 minutes.'],['Dyeing','The fibers are dyed for 5 days to 1 week.'],['After red','After rinsing and drying, the knots protecting the creamy-white bukay are removed. Fibers are separated and combed for weaving.',1]]},
{type:'grid',im:[["Tboli backstrap loom", "Backstrap loom"], ["backstrap loom weaver Philippines", "Weaver at the loom"]],x:['legogong', 'longhouse'],k:'T’nalak · Stage 6',t:'Step 6: Mewel (Weaving)',c:[['The loom','The legogong is a traditional T’boli backstrap loom: horizontal, with two beams.'],['The beams','One beam is attached to the longhouse ceiling; the other to the weaver’s lower back with a backstrap.'],['The longhouse','Its cool environment helps prevent the abaca fibers from snapping.',1]]},
{type:'grid',im:[["Tnalak weaving cloth", "Weaving T’nalak"], ["weaving shuttle loom", "Shuttle"]],k:'T’nalak · Stage 6',t:'Weaving the Cloth',c:[['The shuttle','The weaver passes a shuttle through the threads.'],['Tightening','The weave is tightened with a smooth, flat piece of coconut wood, repeated three times for a tight, firm fabric.'],['The time','About 14 days to one month, depending on fiber quality and design complexity.'],['Finishing','Washed in a cold river, slightly air-dried, and repeatedly beaten with a round wooden stick to flatten the knots and smoothen the surface before burnishing.',1]]},
{type:'grid',im:[["cowrie shell", "Saki (cowrie shell)"], ["Tnalak cloth Tboli", "Finished T’nalak"], ["cloth rolled storage textile", "Rolled cloth"]],x:['saki'],k:'T’nalak · Stage 7',t:'Step 7: Semaki (Ironing)',c:[['Burnishing','While still moist, the fabric is burnished with a saki (cowrie shell) to flatten the surface and create a smooth finish.'],['The setup','The shell is attached to a bamboo stick secured to the longhouse ceiling for extra pressure.'],['Rubbing','Repeated rubbing produces an even, shiny surface.'],['Storing','Washed in cold, flowing water, hung to dry, then rolled and wrapped in a separate cloth for protection and storage.',1]]},
{type:'cols',im:[["Tboli wedding", "Marriage"], ["Tnalak festival South Cotabato", "T’nalak Festival"]],k:'Cultural & spiritual significance',t:'What T’nalak Means',c:[['Dreams & heritage','Designs pass through generations and are believed to be revealed to skilled weavers in dreams.'],['Marriage','Traditionally exchanged as property during marriage.'],['Childbirth','Used as a covering during childbirth, believed to help ensure safe delivery.',1]]},
{type:'grid',im:[["Tboli brass ring", "Brass"], ["Tboli weaver Lake Sebu", "Weaver"]],k:'Cultural & spiritual significance',t:'Beliefs & Practices',c:[['Stepping over','Stepping over a weaving in progress is believed to bring illness.'],['Cutting the cloth','Must follow traditional practices to avoid sickness or death.'],['A brass ring','May be attached when selling the cloth, to appease the spirits.'],['Abstinence','Women traditionally practice abstinence while weaving to maintain the purity of their art.',1]]},
{type:'grid',im:[["Tboli dreamweaver Lake Sebu", "Dream weaver"], ["Tnalak cloth Tboli", "T’nalak"]],k:'T’boli',t:'Why T’boli Women Are Called “Dream Weavers”',p:'The women who preserve the spiritual tradition of T’nalak weaving are known as “Dream Weavers.”',c:[['The belief','Designs are revealed to them in dreams by Fu Dalu, the spirit of the Abaca.'],['Memory, not drawings','Weavers rely on mental images and memory, not their own patterns or drawn designs.',1]]},
{type:'grid',im:[["Tboli brass casting", "Brass casting"], ["Tboli embroidery beadwork", "T’boli crafts"]],k:'T’boli',t:'Dream Weavers: Crafts & Rules',c:[['Famous for','Dream-inspired and spirit-infused T’nalak weavings.'],['Other crafts','Embroidery, brass casting and more.'],['Rule one','Never step over the fabric while it is being woven.'],['Rule two','Avoid negative emotions or ill disposition while weaving.',1]]},

{type:'grid',im:[["Dagmay Mandaya cloth pattern", "Dagmay pattern"], ["Mandaya textile", "Mandaya textile"]],k:'Mandaya',t:'Dagmay: Technique & Motifs',c:[['Technique','Traditional tie-dye with natural dyes from mud, roots and other organic materials.'],['Motifs','Human, crocodile, diamond, cross and curvilinear, inspired by Mandaya folklore and beliefs.'],['Stories & age','Each design carries a story. Many are over a hundred years old and believed to be revealed through dreams.',1]]},

let ac,on=true,timers=[];const SC=[262,294,330,392,440,523,587,659];
function out(g,t,d){g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(f,d,type='sine',v=.15,t=ac.currentTime){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);out(g,t,d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function noise(d,f,v){const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),q=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;s.buffer=b;q.type='bandpass';q.frequency.value=f;q.Q.value=3;g.gain.setValueAtTime(v,t);out(g,t,d);s.connect(q).connect(g).connect(ac.destination);s.start()}
const gong=()=>[1,2.76,5.4,8.9].forEach((m,i)=>tone(98*m,3.2/(i+1),'sine',.16/(i+1)));
